name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install
        run: npm ci

      - name: Build web app
        run: npx vite build

      - name: Sync Android project
        run: npx cap sync android

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Monarx-prodazhi.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Monarx-prodazhi-apk
          path: Monarx-prodazhi.apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-${{ github.run_number }}"
          gh release create "$TAG" Monarx-prodazhi.apk --title "Monarx продажи — сборка ${{ github.run_number }}" --notes "APK для Android. Установите файл на телефоне." --latest

      - name: Push APK to apk branch
        run: |
          mkdir out && cp Monarx-prodazhi.apk out/ && cd out
          git init -q -b apk
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add Monarx-prodazhi.apk && git commit -q -m "APK build ${{ github.run_number }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" apk
